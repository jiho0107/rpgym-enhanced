services:

  # PostgreSQL
  postgres-user:
    image: postgres:16
    container_name: rp-gym-postgres-user
    restart: unless-stopped

    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-user-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  postgres-health:
    image: postgres:16
    container_name: rp-gym-postgres-health
    restart: unless-stopped

    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-health-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  postgres-game:
    image: postgres:16
    container_name: rp-gym-postgres-game
    restart: unless-stopped

    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-game-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  postgres-notification:
    image: postgres:16
    container_name: rp-gym-postgres-notification
    restart: unless-stopped

    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-notification-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  # Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: rp-gym-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - shared-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rp-gym-kafka-ui
    restart: unless-stopped

    environment:
      KAFKA_CLUSTERS_0_NAME: rp-gym
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui

    expose:
      - "8080"

    depends_on:
      kafka:
        condition: service_started

    networks:
      - shared-network
      - blue-network

  # Redis
  redis:
    image: redis:8.8.2
    container_name: rp-gym-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    networks:
      - shared-network

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: rp-gym-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - "9090"

    networks:
      - shared-network
      - blue-network
      - green-network

  # Grafana
  grafana:
    image: grafana/grafana:13.2.2
    container_name: rp-gym-grafana
    restart: unless-stopped

    environment:
      # nginx /grafana/ 경로 뒤에서 서빙하기 위한 서브패스 설정
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Grafana 초기 관리자 계정
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"

      # Slack Alerting에서 사용할 Webhook URL
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

      # Grafana Alerting 설정
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

    expose:
      - "3000"

    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

    networks:
      - shared-network
      - blue-network

  # Loki
  loki:
    image: grafana/loki:3.7.0
    container_name: rp-gym-loki
    restart: unless-stopped

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

    expose:
      - "3100"

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  # Grafana Alloy
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: rp-gym-alloy
    restart: unless-stopped

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      loki:
        condition: service_healthy

    networks:
      - shared-network

  # Zipkin
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: rp-gym-zipkin
    restart: unless-stopped

    environment:
      HEALTHCHECK_IP: 127.0.0.1
      # 인메모리 저장 상한 (기본값 유지) - 부하테스트 중 OOM/메모리 급증 방지
      MEM_MAX_SPANS: ${ZIPKIN_MEM_MAX_SPANS}

    expose:
      - "9411"

    networks:
      - shared-network
      - blue-network
      - green-network

  # Eureka Blue
  eureka-server-blue:
    build:
      context: ./deploy/blue/eureka
      dockerfile: ../../Dockerfile

    container_name: rp-gym-eureka-blue
    restart: unless-stopped

    environment:
      EUREKA_HOST: eureka-server-blue

    expose:
      - "19000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    networks:
      - blue-network

  # Eureka Green
  eureka-server-green:
    build:
      context: ./deploy/green/eureka
      dockerfile: ../../Dockerfile

    container_name: rp-gym-eureka-green
    restart: unless-stopped

    environment:
      EUREKA_HOST: eureka-server-green

    expose:
      - "19000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    networks:
      - green-network

  # Gateway Blue
  gateway-blue:
    build:
      context: ./deploy/blue/gateway
      dockerfile: ../../Dockerfile

    container_name: rp-gym-gateway-blue
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19001"
      - "19091"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      eureka-server-blue:
        condition: service_healthy

    networks:
      - blue-network

  # Gateway Green
  gateway-green:
    build:
      context: ./deploy/green/gateway
      dockerfile: ../../Dockerfile

    container_name: rp-gym-gateway-green
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19001"
      - "19091"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19091/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      eureka-server-green:
        condition: service_healthy

    networks:
      - green-network

  # User Blue
  user-service-blue:
    build:
      context: ./deploy/blue/user
      dockerfile: ../../Dockerfile

    container_name: rp-gym-user-blue
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-user:5432/user_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: user-service-blue
      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      JWT_SECRET: ${JWT_SECRET}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19010"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19010/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server-blue:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # User Green
  user-service-green:
    build:
      context: ./deploy/green/user
      dockerfile: ../../Dockerfile

    container_name: rp-gym-user-green
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-user:5432/user_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: user-service-green
      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      JWT_SECRET: ${JWT_SECRET}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19010"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19010/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server-green:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Health Blue
  health-service-blue:
    build:
      context: ./deploy/blue/health
      dockerfile: ../../Dockerfile

    container_name: rp-gym-health-blue
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-health:5432/health_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: health-service-blue
      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

      GEMINI_API_KEY: ${GEMINI_API_KEY}

    expose:
      - "19011"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19011/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-health:
        condition: service_healthy
      eureka-server-blue:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # Health Green
  health-service-green:
    build:
      context: ./deploy/green/health
      dockerfile: ../../Dockerfile

    container_name: rp-gym-health-green
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-health:5432/health_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: health-service-green
      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

      GEMINI_API_KEY: ${GEMINI_API_KEY}

    expose:
      - "19011"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19011/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-health:
        condition: service_healthy
      eureka-server-green:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Game Blue
  game-service-blue:
    build:
      context: ./deploy/blue/game
      dockerfile: ../../Dockerfile

    container_name: rp-gym-game-blue
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-game:5432/game_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: game-service-blue
      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19012"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19012/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-game:
        condition: service_healthy
      eureka-server-blue:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # Game Green
  game-service-green:
    build:
      context: ./deploy/green/game
      dockerfile: ../../Dockerfile

    container_name: rp-gym-game-green
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-game:5432/game_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: game-service-green
      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

    expose:
      - "19012"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19012/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-game:
        condition: service_healthy
      eureka-server-green:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Notification Blue
  notification-service-blue:
    build:
      context: ./deploy/blue/notification
      dockerfile: ../../Dockerfile

    container_name: rp-gym-notification-blue
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: notification-service-blue
      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}

    expose:
      - "19013"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19013/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server-blue:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # Notification Green
  notification-service-green:
    build:
      context: ./deploy/green/notification
      dockerfile: ../../Dockerfile

    container_name: rp-gym-notification-green
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_INSTANCE_HOSTNAME: notification-service-green
      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}

    expose:
      - "19013"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:19013/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server-green:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Nginx
  nginx:
    image: nginx:1.31.6
    container_name: rp-gym-nginx
    restart: unless-stopped

    environment:
      ZIPKIN_UI_USER: ${ZIPKIN_UI_USER}
      ZIPKIN_UI_PASSWORD_HASH: ${ZIPKIN_UI_PASSWORD_HASH}
      KAFKA_UI_USER: ${KAFKA_UI_USER}
      KAFKA_UI_PASSWORD_HASH: ${KAFKA_UI_PASSWORD_HASH}

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/service-url.inc:/etc/nginx/conf.d/service-url.inc:ro
      - ./nginx/docker-entrypoint.d/40-zipkin-htpasswd.sh:/docker-entrypoint.d/40-zipkin-htpasswd.sh:ro
      - ./nginx/docker-entrypoint.d/50-kafka-ui-htpasswd.sh:/docker-entrypoint.d/50-kafka-ui-htpasswd.sh:ro

    networks:
      - blue-network
      - green-network

volumes:
  postgres-user-data:
  postgres-health-data:
  postgres-game-data:
  postgres-notification-data:

  kafka-data:
  redis-data:

  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  shared-network:
    name: rp-gym-shared-network
    driver: bridge

  blue-network:
    name: rp-gym-blue-network
    driver: bridge

  green-network:
    name: rp-gym-green-network
    driver: bridge