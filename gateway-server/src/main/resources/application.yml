server:
  port: 19001
  # 종료 신호를 받으면 기존 요청이 완료될 시간을 주고, 새로운 요청은 받지 않도록 하는 방식
  shutdown: graceful

spring:
  application:
    name: gateway-server

  lifecycle:
    # Graceful Shutdown 단계별 최대 대기 시간
    timeout-per-shutdown-phase: 30s

  config:
    import: optional:file:.env[.properties]

  reactor:
    # Reactor Context의 context propagation을 활성화
    context-propagation: auto

  cloud:
    gateway:
      server:
        webflux:
          # Timeout 적용
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s

          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/health-profiles/**, /api/v1/long-term-goals/**, /api/v1/daily-goals/**

            - id: health-service
              uri: lb://health-service
              predicates:
                - Path=/api/v1/health-activities/**, /api/v1/health-summary/**

            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/v1/games/**, /api/v2/games/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            # OpenAPI Docs
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user, /v3/api-docs

            - id: health-service-api-docs
              uri: lb://health-service
              predicates:
                - Path=/v3/api-docs/health
              filters:
                - RewritePath=/v3/api-docs/health, /v3/api-docs

            - id: game-service-api-docs
              uri: lb://game-service
              predicates:
                - Path=/v3/api-docs/game
              filters:
                - RewritePath=/v3/api-docs/game, /v3/api-docs

            - id: notification-service-api-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification
              filters:
                - RewritePath=/v3/api-docs/notification, /v3/api-docs

eureka:
  client:
    # Eureka Server에 Gateway 자신을 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    # Gateway에서 서비스 라우팅 시 사용
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19000/eureka/}

management:
  server:
    # actuator를 애플리케이션 포트(19001)와 분리 - 외부(nginx)에는 노출하지 않고
    # 도커 내부망에서 Prometheus만 접근하도록 함
    port: 19091

  endpoints:
    web:
      exposure:
        include: health, prometheus

  tracing:
    sampling:
      # 로컬에서는 모든 요청을 trace 대상으로 잡음
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /v3/api-docs/user
      - name: Health Service
        url: /v3/api-docs/health
      - name: Game Service
        url: /v3/api-docs/game
      - name: Notification Service
        url: /v3/api-docs/notification