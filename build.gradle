plugins {
    // 하위 Spring Boot 애플리케이션에서 사용할 Spring Boot 버전 관리
    id 'org.springframework.boot' version '3.5.16' apply false

    // 하위 모듈의 의존성 버전 관리
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.workoutdone'
version = '1.0-SNAPSHOT'

// 루트 + 모든 하위 모듈
allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.16"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
        }

        dependencies {
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.14'
            dependency 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.14'
        }
    }

    plugins.withId('java') {
        dependencies {
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.projectlombok:lombok'

            testCompileOnly 'org.projectlombok:lombok'
            testAnnotationProcessor 'org.projectlombok:lombok'

            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
            testImplementation 'org.assertj:assertj-core'
            testImplementation 'org.mockito:mockito-junit-jupiter'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

}