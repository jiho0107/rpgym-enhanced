apiVersion: 1

groups:
  - orgId: 1
    name: spring-boot-cpu-alerts
    folder: RPGym Monitoring

    # 1분마다 CPU 상태 평가
    interval: 1m

    rules:
      - uid: spring-boot-cpu-high
        title: Spring Boot CPU High
        condition: C

        data:
          # Spring Boot 프로세스 CPU 사용률 조회
          # uid가 prometheus인 데이터소스에서 process_cpu_usage를 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: process_cpu_usage
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          # 각 서비스의 마지막 CPU 값 사용
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # CPU 사용률 50% 초과 여부 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 50% 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: spring-boot-cpu-high

        annotations:
          summary: "Spring Boot 프로세스 CPU 사용률 50% 초과"
          description: "CPU 사용률이 5분 이상 50%를 초과했습니다."

  # Health Service Outbox 상태 모니터링
  - orgId: 1
    name: health-outbox-alerts
    folder: RPGym Monitoring

    # 1분마다 Outbox 상태 평가
    interval: 1m

    rules:
      # 최근 10분 동안 DLQ 이벤트가 1건 이상 발생하면 알림
      - uid: health-outbox-dlq-detected
        title: Health Outbox DLQ Detected
        condition: C

        data:
          # job 기준으로 집계하여 Blue/Green 환경을 구분
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_outbox_dlq_total[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # DLQ 발생 건수가 0보다 크면 Firing
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: health-outbox-dlq-detected

        annotations:
          summary: "Health Service Outbox DLQ 발생"
          description: "최근 10분 동안 Outbox 이벤트가 DLQ로 이동했습니다."


      # 미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 지속되면 알림
      - uid: health-outbox-pending-high
        title: Health Outbox Pending High
        condition: C

        data:
          # 미발행(PENDING) Outbox 이벤트 수 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rpgym_outbox_pending_count
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # 미발행 이벤트가 1000건을 초과했는지 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 1000건 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: health-outbox-pending-high

        annotations:
          summary: "Health Service Outbox 발행 적체"
          description: "미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 이상 지속되었습니다."