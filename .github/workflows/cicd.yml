name: CI/CD

on:
  pull_request:
    branches: ["develop", "main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

# GitHub Repository 내용을 읽기만 할 수 있도록 권한 제한
permissions:
  contents: read

jobs:
  # CI
  build_and_test:
    name: Build & Test

    # GitHub Actions에서 제공하는 Ubuntu 환경에서 실행
    runs-on: ubuntu-latest

    # 같은 브랜치에 새로운 커밋이 올라오면
    # 이전 CI를 취소하고 최신 커밋 기준으로 다시 검증
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    # CI가 15분 이상 실행되면 강제 종료
    timeout-minutes: 15

    steps:
      # 소스 코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # 변경된 파일을 비교하기 위해 전체 Git 히스토리를 가져옴
          fetch-depth: 0

      # Docker Compose 설정 검증
      # Gradle 모듈 변경 여부와 관계없이 Compose 문법 오류를 검사
      - name: Validate Docker Compose
        run: docker compose -f docker-compose-prod.yml config -q

      # Java 환경 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Eclipse Temurin JDK 사용
          distribution: temurin

          # 프로젝트에서 사용하는 Java 버전과 동일하게 17 사용
          java-version: "17"

          # Gradle 의존성 캐시 사용하여 빌드 시간 단축
          cache: gradle

      # Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

        # Gradle 의존성 및 빌드 캐시를 관리하여
        # 반복되는 CI 빌드 시간을 줄임

      # PR인 경우 변경된 파일 확인
      # tj-actions/changed-files: 변경된 파일과 디렉터리를 찾아주는 Action
      # 버전 태그 대신 특정 커밋으로 고정하여 동일한 코드가 실행되도록 설정
      - name: Get changed files
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      # 변경된 모듈 분석
      - name: Determine affected modules
        id: analyze
        env:
          EVENT_NAME: ${{ github.event_name }}

          # PR에서 변경된 모든 파일 경로
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

        shell: bash

        run: |
          # main에 push된 경우
          # main은 최종 통합 코드이므로
          # 특정 모듈만이 아니라 전체 프로젝트를 검증
          # 따라서 모든 Gradle 모듈을 build
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "TASKS=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR 변경 모듈 분석
          # 전체 빌드가 필요한지 여부
          RUN_ALL=false

          # 변경된 모듈을 저장할 배열
          MODULES=()

          # 변경된 파일을 하나씩 확인
          for file in $CHANGED_FILES; do

            # 공통 모듈 또는 루트/CI 설정이 변경된 경우
            # 전체 모듈에 영향을 줄 수 있으므로 전체 build
            case "$file" in
              common/*|\
              settings.gradle|\
              build.gradle|\
              gradle/*|\
              gradlew|\
              gradlew.bat|\
              .github/workflows/*)

                RUN_ALL=true
                break
                ;;
            esac

            # 변경된 파일의 첫 번째 디렉터리를 모듈명으로 사용
            #
            # 예:
            # user-service/src/...      -> user-service
            # discovery-server/src/...  -> discovery-server
            module=$(echo "$file" | cut -d/ -f1)

            # 실제 Gradle 모듈인지 확인
            if [[ -f "$module/build.gradle" ]]; then
              MODULES+=("$module")
            fi

          done

          # 전체 빌드가 필요한 경우
          if [[ "$RUN_ALL" == true ]]; then
            echo "TASKS=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 중복된 모듈 제거
          UNIQUE=$(printf "%s\n" "${MODULES[@]}" | sort -u)

          # 애플리케이션 모듈 변경이 없는 경우
          #
          # README / docs 등의 변경만 있는 경우
          # 빌드할 Gradle 모듈이 없으므로 종료
          if [[ -z "$UNIQUE" ]]; then
            echo "TASKS=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TASKS=""

          # 변경된 모듈만 Gradle build task 생성
          #
          # 예:
          # user-service
          # ->
          # :user-service:build
          while IFS= read -r module
          do
            [[ -z "$module" ]] && continue

            TASKS="$TASKS :$module:build"

          done <<< "$UNIQUE"

          echo "TASKS=$TASKS" >> "$GITHUB_OUTPUT"

      # Gradle 실행 권한 설정
      - name: Grant execute permission
        if: ${{ steps.analyze.outputs.TASKS != 'none' }}
        run: chmod +x gradlew

      # 변경된 모듈 Build & Test
      - name: Run Build
        if: ${{ steps.analyze.outputs.TASKS != 'none' }}
        run: |
          ./gradlew ${{ steps.analyze.outputs.TASKS }} \
            --parallel \
            --build-cache

      # Gradle build task에는 테스트 실행도 포함되므로
      # 별도의 test task를 추가하지 않아도 됨

      # 빌드/테스트 실패 시 결과 업로드
      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # 각 모듈의 테스트 결과를 모두 수집
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

          # GitHub Actions에서 확인할 수 있는 Artifact 이름
          name: test-report

      # main 배포용 JAR Artifact
      #
      # main push에서는 위에서 TASKS=build가 설정되므로
      # 전체 프로젝트 build가 실행됨
      #
      # 따라서 아래 서비스의 실행 JAR이 모두 생성됨
      - name: Upload Application JARs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            discovery-server/build/libs/discovery-server.jar
            gateway-server/build/libs/gateway-server.jar
            user-service/build/libs/user-service.jar
            health-service/build/libs/health-service.jar
            game-service/build/libs/game-service.jar
            notification-service/build/libs/notification-service.jar
          retention-days: 7

  # CD
  deploy:
    name: Deploy

    # CI가 성공한 경우에만 CD 실행
    needs: build_and_test

    # main에 실제 push된 경우에만 배포
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest

    # main에 연속으로 push된 경우에도 동시 실행 방지
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    # CD가 15분 이상 실행되면 강제 종료
    timeout-minutes: 15

    steps:

      # 소스 코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v4

      # JAR Artifact 다운로드
      - name: Download Application JARs
        uses: actions/download-artifact@v4
        with:
          name: application-jars
          path: artifacts

      # SSH 설정
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # GitHub Secrets로 EC2 .env 생성
      - name: Create EC2 environment file
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZIPKIN_UI_USER: ${{ secrets.ZIPKIN_UI_USER }}
          ZIPKIN_UI_PASSWORD_HASH: ${{ secrets.ZIPKIN_UI_PASSWORD_HASH }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          VARS=(
            JWT_SECRET
            POSTGRES_PASSWORD
            GEMINI_API_KEY
            ZIPKIN_UI_USER
            ZIPKIN_UI_PASSWORD_HASH
            GRAFANA_ROOT_URL
            SLACK_WEBHOOK_URL
            SLACK_BOT_TOKEN
            SLACK_SIGNING_SECRET
          )

          # 필수 Secret 누락 및 작은따옴표 포함 여부 검증
          for VAR in "${VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Secret ${VAR} is empty"
              exit 1
            fi

            if [[ "${!VAR}" == *"'"* ]]; then
              echo "::error::Secret ${VAR} must not contain single quotes"
              exit 1
            fi
          done

          # Compose의 변수 치환을 방지하기 위해 값을 작은따옴표로 감싸서 저장
          for VAR in "${VARS[@]}"; do
            printf "%s='%s'\n" "$VAR" "${!VAR}"
          done > "$ENV_FILE"

          scp \
            -i ~/.ssh/ec2.pem \
            "$ENV_FILE" \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/.env

          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "chmod 600 /home/ubuntu/rp-gym/.env"

      # EC2 연결 확인
      - name: Check EC2 connection
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo 'EC2 connection successful'"

      # 현재 활성 환경 확인
      - name: Determine target environment
        id: target
        run: |
          CURRENT=$(ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "grep -E 'server gateway-(blue|green):19001;' /home/ubuntu/rp-gym/nginx/service-url.inc | awk '{print \$2}' | cut -d':' -f1")

          echo "Current environment: ${CURRENT}"

          if [[ "${CURRENT}" == "gateway-blue" ]]; then
            TARGET="green"
          elif [[ "${CURRENT}" == "gateway-green" ]]; then
            TARGET="blue"
          else
            echo "Invalid current environment: ${CURRENT}"
            exit 1
          fi

          echo "Target environment: ${TARGET}"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      # 배포에 필요한 인프라 설정 파일 전달
      # service-url.inc는 deploy.sh가 현재 Blue/Green 상태를 관리하므로 전송하지 않음
      - name: Upload Deployment Configuration
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/rp-gym/nginx/docker-entrypoint.d \
                      /home/ubuntu/rp-gym/monitoring/prometheus \
                      /home/ubuntu/rp-gym/monitoring/loki \
                      /home/ubuntu/rp-gym/monitoring/alloy \
                      /home/ubuntu/rp-gym/monitoring/grafana/provisioning/datasources \
                      /home/ubuntu/rp-gym/monitoring/grafana/provisioning/dashboards \
                      /home/ubuntu/rp-gym/monitoring/grafana/provisioning/alerting"

          scp \
            -i ~/.ssh/ec2.pem \
            docker-compose-prod.yml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/docker-compose-prod.yml

          scp \
            -i ~/.ssh/ec2.pem \
            nginx/nginx.conf \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/nginx/nginx.conf

          scp \
            -i ~/.ssh/ec2.pem \
            nginx/docker-entrypoint.d/40-zipkin-htpasswd.sh \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/nginx/docker-entrypoint.d/40-zipkin-htpasswd.sh

          scp \
            -i ~/.ssh/ec2.pem \
            monitoring/prometheus/prometheus-prod.yml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/prometheus/prometheus-prod.yml

          scp \
            -i ~/.ssh/ec2.pem \
            monitoring/loki/loki-config.yml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/loki/loki-config.yml

          scp \
            -i ~/.ssh/ec2.pem \
            monitoring/alloy/config.alloy \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/alloy/config.alloy

          scp -r \
            -i ~/.ssh/ec2.pem \
            monitoring/grafana/provisioning/datasources \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/grafana/provisioning/

          scp -r \
            -i ~/.ssh/ec2.pem \
            monitoring/grafana/provisioning/dashboards \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/grafana/provisioning/
          
          scp -r \
            -i ~/.ssh/ec2.pem \
            monitoring/grafana/provisioning/alerting \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/monitoring/grafana/provisioning/

          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "chmod +x /home/ubuntu/rp-gym/nginx/docker-entrypoint.d/40-zipkin-htpasswd.sh"

      # 배포 대상 환경에 JAR 전달
      - name: Upload Application JARs
        run: |
          TARGET="${{ steps.target.outputs.target }}"

          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/rp-gym/deploy/${TARGET}/eureka \
                      /home/ubuntu/rp-gym/deploy/${TARGET}/gateway \
                      /home/ubuntu/rp-gym/deploy/${TARGET}/user \
                      /home/ubuntu/rp-gym/deploy/${TARGET}/health \
                      /home/ubuntu/rp-gym/deploy/${TARGET}/game \
                      /home/ubuntu/rp-gym/deploy/${TARGET}/notification"

          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/discovery-server/build/libs/discovery-server.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/eureka/app.jar

          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/gateway-server/build/libs/gateway-server.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/gateway/app.jar

          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/user-service/build/libs/user-service.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/user/app.jar

          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/health-service/build/libs/health-service.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/health/app.jar

          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/game-service/build/libs/game-service.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/game/app.jar
          
          scp \
            -i ~/.ssh/ec2.pem \
            artifacts/notification-service/build/libs/notification-service.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/${TARGET}/notification/app.jar

      # deploy.sh 전달
      - name: Upload deploy script
        run: |
          scp \
            -i ~/.ssh/ec2.pem \
            deploy/deploy.sh \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/rp-gym/deploy/deploy.sh

          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "chmod +x /home/ubuntu/rp-gym/deploy/deploy.sh"

      # deploy.sh 실행
      - name: Run deploy script
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "cd /home/ubuntu/rp-gym && bash deploy/deploy.sh"