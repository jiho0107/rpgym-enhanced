services:

  # PostgreSQL
  postgres-user:
    image: postgres:16
    container_name: rp-gym-postgres-user
    restart: unless-stopped
    ports:
      - "19040:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-health:
    image: postgres:16
    container_name: rp-gym-postgres-health
    restart: unless-stopped
    ports:
      - "19041:5432"
    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-health-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-game:
    image: postgres:16
    container_name: rp-gym-postgres-game
    restart: unless-stopped
    ports:
      - "19042:5432"
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-notification:
    image: postgres:16
    container_name: rp-gym-postgres-notification
    restart: unless-stopped
    ports:
      - "19043:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: rp-gym-kafka
    restart: unless-stopped
    ports:
      - "19030:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19030
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rp-gym-kafka-ui
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: rp-gym
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - app-network

  # redis
  redis:
    image: redis:8.8.2
    container_name: rp-gym-redis
    restart: unless-stopped
    ports:
      - "19031:6379"
    volumes:
      - redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    networks:
      - app-network

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: rp-gym-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus-develop.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "9091:9090"

    networks:
      - app-network

  # Grafana
  grafana:
    image: grafana/grafana:13.2.2
    container_name: rp-gym-grafana
    restart: unless-stopped

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    ports:
      - "3000:3000"

    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

    networks:
      - app-network

  # Loki
  loki:
    image: grafana/loki:3.7.0
    container_name: rp-gym-loki
    restart: unless-stopped

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

    ports:
      - "3100:3100"

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  # Grafana Alloy
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: rp-gym-alloy
    restart: unless-stopped

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      loki:
        condition: service_healthy

    networks:
      - app-network

  # Zipkin
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: rp-gym-zipkin
    restart: unless-stopped
    environment:
      # 인메모리 저장 상한 (기본값 유지) - 부하테스트 중 OOM/메모리 급증 방지
      MEM_MAX_SPANS: ${ZIPKIN_MEM_MAX_SPANS:-500000}
    ports:
      - "9411:9411"
    networks:
      - app-network

volumes:
  kafka-data:
  redis-data:
  postgres-user-data:
  postgres-health-data:
  postgres-game-data:
  postgres-notification-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  app-network:
    name: rp-gym-network
    driver: bridge