server:
  port: 19013

spring:
  application:
    name: notification-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:notification-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # DDL은 Flyway가 만든다. 엔티티와 실제 테이블이 어긋나면 기동 시점에 실패한다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification_service

  flyway:
    schemas: notification_service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: notification-service
      # 컨슈머가 늦게 떠도 밀린 이벤트를 처음부터 읽는다(earliest)
      auto-offset-reset: earliest
      # 자동 커밋은 처리 성공과 무관하게 시간으로 커밋해서 실패한 이벤트가 조용히 사라진다.
      # 컨슈머 메서드가 정상적으로 끝났을 때만 체크되게 설정
      enable-auto-commit: false
      # Kafka에서 받은 원본 바이트를 일단 그냥 문자열로만 바꾸기
      # 어떤 타입의 이벤트인지 먼저 확인하고 그다음에 맞는 모양으로 파싱하기 위함
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: RECORD #메시지 한 건 처리할 때마다 "여기까지 읽었다"고 체크
      observation-enabled: true #분산 추적(트레이싱) 연결용

    template:
      observation-enabled: true #분산 추적(트레이싱) 연결용

feign:
  client:
    config:
      user-service:
        # slackId 조회가 이 시간 안에 안 끝나면 실패로 보고 예외를 던진다 (Kafka가 메시지 전체를 재시도한다).
        connect-timeout: 1000
        read-timeout: 2000

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19000/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.workoutdone.rpgym.notification: DEBUG
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{eventId:-}] "

rpgym:
  kafka:
    # game-service가 QUEST_SUGGESTED를 발행하는 토픽
    game-events-topic: game.events

  slack:
    bot-token: ${SLACK_BOT_TOKEN}
