worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    include /etc/nginx/conf.d/service-url.inc;

    server {
        listen 80;

        location / {
            proxy_pass http://gateway;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Zipkin UI - Basic Auth로 보호 (운영에서 트레이스 데이터 보호, 계정은 .env의 ZIPKIN_UI_USER/ZIPKIN_UI_PASSWORD_HASH)
        location /zipkin {
            auth_basic "Zipkin";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://zipkin:9411;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana - 자체 로그인만 사용 (Basic Auth 없음), 서브패스로 서빙 (grafana의 GF_SERVER_SERVE_FROM_SUB_PATH=true와 짝)
        location /grafana/ {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Kafka UI - Basic Auth로 보호
        location /kafka-ui/ {
            auth_basic "Kafka UI";
            auth_basic_user_file /etc/nginx/.htpasswd-kafka-ui;

            proxy_pass http://kafka-ui:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}